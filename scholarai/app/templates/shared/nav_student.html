<!-- This is the top navigation bar for students, allowing them to access their dashboard, activity, and chatbot. -->
<nav class="topnav">
  <div class="topnav__brand">
    <div class="topnav__logo">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SA">
    </div>
    <div class="topnav__toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></div>
  </div>
  <div class="topnav__links">
    <a href="{{ url_for('student.dashboard') }}" class="topnav__link {% if active=='dashboard' %}active{% endif %}">DASHBOARD</a>
    <a href="{{ url_for('student.activity') }}"  class="topnav__link {% if active=='activity'  %}active{% endif %}">ACTIVITY</a>
    <a href="{{ url_for('student.chatbot') }}"   class="topnav__link {% if active=='chatbot'   %}active{% endif %}">CHATBOT</a>
  </div>
  <div class="topnav__user">
    <div class="topnav__avatar student">ST</div>
    <span class="topnav__role">{{ session.get('student_name', 'Student') }}</span>
    <!-- Button to switch between light and dark modes. -->
    <button class="theme-toggle" id="themeToggleBtn" title="Toggle Theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
    <a href="{{ url_for('auth.student_logout') }}" class="topnav__logout">LOGOUT</a>
  </div>
</nav>
