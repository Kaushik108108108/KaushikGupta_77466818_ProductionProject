<!-- This is the top navigation bar for students, allowing them to move between their dashboard, activity feed, and chatbot. -->
<nav class="topnav">
  <div class="topnav__brand">
    <div class="topnav__logo">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SA">
    </div>
    <div class="topnav__toggle">MENU</div>
  </div>
  <div class="topnav__links">
    <a href="{{ url_for('student.dashboard') }}" class="topnav__link {% if active=='dashboard' %}active{% endif %}">DASHBOARD</a>
    <a href="{{ url_for('student.activity') }}"  class="topnav__link {% if active=='activity'  %}active{% endif %}">ACTIVITY</a>
    <a href="{{ url_for('student.chatbot') }}"   class="topnav__link {% if active=='chatbot'   %}active{% endif %}">CHATBOT</a>
  </div>
  <div class="topnav__user">
    <div class="topnav__avatar student">ST</div>
    <span class="topnav__role">{{ session.get('student_name', 'Student') }}</span>
    <!-- This button lets students toggle between light and dark themes. -->
    <button class="theme-toggle" id="themeToggleBtn" title="Toggle Theme">MODE</button>
    <a href="{{ url_for('auth.student_logout') }}" class="topnav__logout">LOGOUT</a>
  </div>
</nav>
